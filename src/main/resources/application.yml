spring:
  application:
    name: bulletproof

  datasource:
    url: jdbc:postgresql://localhost:5432/bulletproof_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  cache:
    type: redis
    redis:
      host: localhost
      port: 6379
      time-to-live: 60000